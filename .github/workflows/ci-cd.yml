
name: CloudTasks CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 442255790021.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: aws-todo-app

jobs:
  build-test-push:
    name: Test, Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DB_PASSWORD: test-password
        run: python -m pytest -v

      - name: Build Docker image
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            ./backend

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::442255790021:role/ecr-push-action
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
