
{{- if .Values.rollout.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cloudtasks-active
  labels:
    app.kubernetes.io/name: cloudtasks
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloudtasks
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cloudtasks-preview
  labels:
    app.kubernetes.io/name: cloudtasks
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloudtasks
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cloudtasks
  labels:
    app.kubernetes.io/name: cloudtasks
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloudtasks
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
